steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--source=.'
      - '--region=us-central1'
      - '--project=zb-firebase-projects-poc'
      - '--service-account=cloud-deploy@zb-firebase-projects-poc.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      # Pinned to exactly one always-on instance. Needed because
      # src/lib/data/operational-live-source.ts caches n8n-webhook rows
      # in memory when there's no DATABASE_URL — with Cloud Run's default
      # autoscaling (or min-instances=0), a page load can land on a
      # different instance than the one that received the webhook POST
      # (or a fresh one after scale-to-zero), showing demo data even
      # though the webhook succeeded. Safe to remove once DATABASE_URL
      # exists (real persistence, no cache to keep consistent).
      - '--min-instances=1'
      - '--max-instances=1'
      # Node.js runtime pin. NOTE: the current Google Cloud Buildpacks env
      # var is GOOGLE_NODEJS_VERSION, not GOOGLE_RUNTIME_VERSION — verify
      # with TechOps before first deploy, this sandbox couldn't reach
      # cloud.google.com docs to double-check live. Next.js 16 requires
      # Node >=20.9; Node 20 LTS reached end-of-life Apr 2026, so 22.x is
      # the lowest LTS line still expected in the current builder image.
      - '--set-build-env-vars=GOOGLE_NODEJS_VERSION=22.x.x'
      # Secrets mounted securely directly from Google Secret Manager
      - '--set-secrets=N8N_WEBHOOK_SECRET=finance-ops-n8n-webhook-secret:latest'
      # Public (non-secret) config hardcoded directly; dynamic database secrets passed as substitutions
      - '--set-env-vars=GOOGLE_SERVICE_ACCOUNT_EMAIL=REPLACE_ME,GOOGLE_SHEETS_SPREADSHEET_ID=1dOfBB8gcZsBR-GTPkYQcOdTbpbXH0MQk0FHuri6uRqY,BIGQUERY_PROJECT_ID=zb-data-bu-mexico-dev,BIGQUERY_DATASET=1_raw_ext_gsheet,GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY},DATABASE_URL=${_DATABASE_URL},AUTH_SECRET=${_AUTH_SECRET},AUTH_GOOGLE_ID=${_AUTH_GOOGLE_ID},AUTH_GOOGLE_SECRET=${_AUTH_GOOGLE_SECRET}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SERVICE_NAME: 'finance-ops-poc'
  # List ONLY sensitive secrets here for TechOps to fill in the trigger.
  # Leave DATABASE_URL/AUTH_* empty until Cloud SQL + the Google OAuth
  # Client exist — the app just runs in demo mode until then.
  _GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ''
  _DATABASE_URL: ''
  _AUTH_SECRET: ''
  _AUTH_GOOGLE_ID: ''
  _AUTH_GOOGLE_SECRET: ''
