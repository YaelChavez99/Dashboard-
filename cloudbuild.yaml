steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--source=.'
      - '--region=us-central1'
      - '--project=zb-firebase-projects-poc'
      - '--service-account=cloud-deploy@zb-firebase-projects-poc.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      # Node.js runtime pin. NOTE: the current Google Cloud Buildpacks env
      # var is GOOGLE_NODEJS_VERSION, not GOOGLE_RUNTIME_VERSION — verify
      # with TechOps before first deploy, this sandbox couldn't reach
      # cloud.google.com docs to double-check live. Next.js 16 requires
      # Node >=20.9; Node 20 LTS reached end-of-life Apr 2026, so 22.x is
      # the lowest LTS line still expected in the current builder image.
      - '--set-build-env-vars=GOOGLE_NODEJS_VERSION=22.x.x'
      # Database (Cloud SQL for SQL Server) + Google Workspace login are
      # both zero-touch once TechOps provisions them — the app falls back
      # to its built-in demo mode (seeded example data, no real login)
      # as long as DATABASE_URL is unset. No Supabase/Vercel involved at
      # all — see docs/database-schema.md for what to provision.
      # Public (non-secret) config hardcoded directly; secrets passed as
      # Cloud Build substitutions (TechOps fills these in on the Trigger,
      # never hardcoded here). REPLACE_ME values are ones this session
      # never had — fill in before the first real deploy.
      - '--set-env-vars=GOOGLE_SERVICE_ACCOUNT_EMAIL=REPLACE_ME,GOOGLE_SHEETS_SPREADSHEET_ID=1dOfBB8gcZsBR-GTPkYQcOdTbpbXH0MQk0FHuri6uRqY,BIGQUERY_PROJECT_ID=zb-data-bu-mexico-dev,BIGQUERY_DATASET=1_raw_ext_gsheet,GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY},DATABASE_URL=${_DATABASE_URL},AUTH_SECRET=${_AUTH_SECRET},AUTH_GOOGLE_ID=${_AUTH_GOOGLE_ID},AUTH_GOOGLE_SECRET=${_AUTH_GOOGLE_SECRET},N8N_WEBHOOK_SECRET=${_N8N_WEBHOOK_SECRET}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SERVICE_NAME: 'finance-ops-poc'
  # List ONLY sensitive secrets here for TechOps to fill in the trigger.
  # Leave DATABASE_URL/AUTH_* empty until Cloud SQL + the Google OAuth
  # Client exist — the app just runs in demo mode until then.
  _GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ''
  _DATABASE_URL: ''
  _AUTH_SECRET: ''
  _AUTH_GOOGLE_ID: ''
  _AUTH_GOOGLE_SECRET: ''
  # Shared secret n8n sends as `Authorization: Bearer <this>` when calling
  # /api/webhooks/n8n-sync — generated by us (not TechOps), shared with
  # them via Passbolt so they can fill in the Trigger substitution.
  _N8N_WEBHOOK_SECRET: ''
